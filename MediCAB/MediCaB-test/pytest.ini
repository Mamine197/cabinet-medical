[pytest]
testpaths = tests unit_backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --base-url=http://127.0.0.1:4200
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: Tests de fumée préliminaires
    rbac: Tests de contrôle d'accès et habilitations par rôle
    appointments: Tests liés à la prise de rendez-vous et anti-collision
    ai: Tests des moteurs et assistants IA
    clinical: Tests des dossiers médicaux et secret médical
    functional: Tests fonctionnels des modules ERP
