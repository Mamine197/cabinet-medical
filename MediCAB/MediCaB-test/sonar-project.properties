# ====================================================================
# MediCAB — SonarQube & SonarCloud Configuration (Espace MediCaB-test)
# ====================================================================

# Identifiants du projet
sonar.projectKey=Mamine197_cabinet-medical
sonar.projectName=MediCAB — Medical ERP & Clinical AI
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Périmètre des fichiers sources (relatif à MediCaB-test/)
sonar.sources=../MediCaB-backend,../MediCaB-frontend/src,../MediCaB-ai

# Périmètre des tests
sonar.tests=.,../MediCaB-frontend/src/app/unit_tests

# Rapports de couverture de tests (Code Coverage)
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.javascript.lcov.reportPaths=../MediCaB-frontend/coverage/lcov.info

# Exclusions strictes pour ne mesurer que le code métier pur
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/out-tsc/**,\
  **/.angular/**,\
  **/migrations/**,\
  **/.pytest_cache/**,\
  **/__pycache__/**,\
  **/coverage/**,\
  **/reports/**,\
  **/*.sqlite3,\
  **/package-lock.json

# Ignorer la duplication sur les migrations et scripts d'initialisation
sonar.cpd.exclusions=\
  **/migrations/**,\
  **/seed_data.py
