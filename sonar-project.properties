# ====================================================================
# MediCAB — SonarQube & SonarCloud Configuration (Racine du Projet)
# ====================================================================

sonar.projectKey=Mamine197_cabinet-medical
sonar.projectName=MediCAB — Medical ERP & Clinical AI
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Périmètre des fichiers sources
sonar.sources=MediCAB/MediCaB-backend,MediCAB/MediCaB-frontend/src,MediCAB/MediCaB-ai

# Périmètre des tests
sonar.tests=MediCAB/MediCaB-test,MediCAB/MediCaB-frontend/src/app/unit_tests

# Rapports de couverture de tests générés par MediCaB-test
sonar.python.coverage.reportPaths=MediCAB/MediCaB-test/reports/coverage.xml
sonar.javascript.lcov.reportPaths=MediCAB/MediCaB-frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/out-tsc/**,\
  **/.angular/**,\
  **/migrations/**,\
  **/.pytest_cache/**,\
  **/__pycache__/**,\
  **/coverage/**,\
  **/reports/**,\
  **/*.sqlite3,\
  **/package-lock.json

sonar.cpd.exclusions=\
  **/migrations/**,\
  **/seed_data.py
